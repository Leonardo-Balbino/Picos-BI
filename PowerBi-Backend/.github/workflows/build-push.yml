name: Build & push da imagem

# Publica a imagem de produção no GHCR (GitHub Container Registry) a cada push em
# main/master. Não existia workflow nenhum de CI neste repositório antes desta rodada
# de padronização — este é o único, e cobre só build+push, sem lint/teste/e2e
# próprios (ver MIGRACAO.md).
#
# A tag da imagem é sempre o SHA do commit (nunca "latest") — docker-compose.prod.yml
# exige IMAGE_TAG explícita via `${IMAGE_TAG:?...}` exatamente para forçar rollback
# determinístico.
on:
  push:
    branches: [main, master]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Nome do produto real ("picos-analytics"), não o nome da pasta do
          # repositório ("PowerBi-Backend") — ver nota de nomenclatura em MIGRACAO.md.
          tags: |
            ghcr.io/${{ github.repository_owner }}/picos-analytics:${{ github.sha }}
