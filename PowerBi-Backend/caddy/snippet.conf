# Bloco de site do POWERBI (produto interno "PICOS Analytics" — ver nota de
# nomenclatura em MIGRACAO.md), para incorporar ao Caddyfile central da VPS
# consolidada — o Caddy roda no repositório de infra, não neste.
#
#   1) import direto, se o Caddyfile central já tiver um diretório de sites:
#        import /etc/caddy/sites/powerbi.conf
#
#   2) colar o conteúdo abaixo (sem a linha de import) direto no Caddyfile
#      central, junto aos blocos dos outros clientes.
#
# <DOMINIO_POWERBI> é placeholder literal — troque pelo domínio real deste
# cliente antes do primeiro deploy.
#
# Pré-requisitos do lado da infra (fora deste repositório):
# - DNS de <DOMINIO_POWERBI> apontando pro IP da VPS (A/AAAA).
# - O container do Caddy precisa estar na mesma rede `net_powerbi` que a app
#   (ver docker-compose.prod.yml) — é assim que ele resolve o hostname
#   "powerbi-app" abaixo; não é acessível de fora dessa rede.
# - Portas 80/443 liberadas e publicadas pelo container do Caddy (não por
#   este repositório).

<DOMINIO_POWERBI> {
	reverse_proxy powerbi-app:3000 {
		# GET /api/v1/health, marcado @Public() (src/health/health.controller.ts) —
		# mesmo endpoint que o HEALTHCHECK do Dockerfile já usa. Se a app cair ou
		# ficar sem banco/Redis, o Caddy para de rotear tráfego pra ela em vez de
		# devolver 502 pro usuário final a cada request.
		health_uri /api/v1/health
		health_interval 30s
		health_timeout 5s
	}

	# Esta API não recebe upload de arquivo (é só sincronização de dados do ERP
	# + leitura pelo front) — sem justificativa registrada pra um limite maior
	# que o default combinado de 10MB do bloco `common` do Caddyfile central.
	request_body {
		max_size 10MB
	}
}

# Nota: `app.set('trust proxy', 1)` (src/main.ts) já está correto pra esta
# topologia — o Caddy, como reverse_proxy, seta X-Forwarded-For/-Proto/-Host
# automaticamente, e "1 hop confiável" continua válido com só o Caddy entre a
# internet e a app.
